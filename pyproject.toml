[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-assistant-windows"
version = "1.1.0"
description = "Open-source Windows developer toolbox with PySide6, SQLite and Git CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "Dev Assistant Contributors"}]
dependencies = ["PySide6>=6.8,<7", "platformdirs>=4,<5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
